runtime:
  headless: false
  max_concurrent_jobs: 1
  default_timeout_sec: 30
  screenshot_on_error: true

security:
  # Add your Telegram user IDs here (get from @userinfobot)
  allow_user_ids: [6128390286]  # Your user ID
  rate_limit_per_min: 20
  require_confirm_for_macros: ["export_report", "submit_quiz", "job_apply"]
  
chrome:
  mode: "chromium"  # "chromium" | "profile"
  # For profile mode (uncomment when needed):
  # chrome_exe: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
  # user_data_dir: "C:\\Users\\YOURNAME\\AppData\\Local\\Google\\Chrome\\User Data"
  # profile_dir: "Profile 2"
  
  # Browser settings
  window_size: [1280, 720]
  args:
    - "--no-sandbox"
    - "--disable-dev-shm-usage"
    - "--disable-gpu"
    - "--disable-extensions"

logging:
  level: "INFO"
  file: "out/clawdbot.log"
  max_size_mb: 10
  backup_count: 5